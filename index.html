    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #07070d; color: #fff; font-family: 'Syne', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1a1a2a; border-radius: 2px; }

    /* ── ANIMATIONS ── */
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── LAYOUT ── */
    #app { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 20px); }

    /* ── HEADER ── */

      position: sticky; top: 0; z-index: 20;
      background: rgba(7,7,13,0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid #111;
      padding: 20px 20px 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));

    .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .header-label { font-size: 9px; color: #2a2a3a; letter-spacing: 3px; margin-bottom: 4px; }
    .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .header-title span { color: #3b82f6; }
    .header-meta { font-size: 10px; color: #222; margin-top: 8px; font-family: 'Space Mono', monospace; }

    /* ── REFRESH BUTTON ── */

      background: #111827; border: 1px solid #3b82f633;
      color: #3b82f6; border-radius: 10px; padding: 8px 16px;
      font-size: 12px; font-family: 'Space Mono', monospace;
      cursor: pointer; transition: all 0.3s; white-space: nowrap;

    .btn-refresh:disabled { background: #0f0f14; border-color: #1a1a2a; color: #2a2a3a; cursor: not-allowed; }

// ═══════════════════════════════════════════════════════════════
// TECHNICAL ANALYSIS
// ═══════════════════════════════════════════════════════════════

// EMA: dá peso exponencial maior aos preços mais recentes
function computeEMA(prices, period) {
  if (prices.length < period) return [];
  const k = 2 / (period + 1);
  let ema = prices.slice(0, period).reduce((a,b) => a+b, 0) / period;
  const result = [ema];
  for (let i = period; i < prices.length; i++) {
    ema = prices[i]*k + ema*(1-k);
    result.push(ema);
  }
  return result;
}

// RSI: compara médias de ganhos vs perdas nos últimos N períodos
function computeRSI(prices, period=14) {
  if (prices.length < period+1) return null;
  let gains=0, losses=0;
  for (let i=1; i<=period; i++) {
    const d = prices[i]-prices[i-1];
    if (d>0) gains+=d; else losses+=Math.abs(d);
  }
  let ag = gains/period, al = losses/period;
  for (let i=period+1; i<prices.length; i++) {
    const d = prices[i]-prices[i-1];
    ag = (ag*(period-1) + Math.max(0,d)) / period;
    al = (al*(period-1) + Math.max(0,-d)) / period;
  }
  if (al===0) return 100;
  return 100 - 100/(1 + ag/al);
}

// Regras de sinal baseadas em RSI + posição em relação às EMAs
function getSignal(rsi, price, ema21, ema55) {
  if (rsi===null || !ema21 || !ema55) return { label:"Calculando", color:"#888", score:0 };
  const above21 = price > ema21;
  const above55 = price > ema55;
  if (rsi<35 && above21)        return { label:"COMPRA FORTE 🔥", color:"#00ff88", score:95 };
  if (rsi<45 && above21)        return { label:"COMPRA",           color:"#22c55e", score:75 };
  if (rsi>72)                   return { label:"VENDA / REALIZAR",  color:"#ef4444", score:15 };
  if (rsi>63 && !above55)       return { label:"ATENÇÃO — VENDA",   color:"#f97316", score:30 };
  if (!above21 && !above55)     return { label:"EVITAR ENTRADA",    color:"#dc2626", score:10 };
  return                               { label:"AGUARDAR",           color:"#f59e0b", score:50 };
}

// HELPERS
// ═══════════════════════════════════════════════════════════════
function fBRL(v) {
  if (!v && v!==0) return "—";
  return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2});
}
function pad(n){ return String(n).padStart(2,"0"); }

// Desenha mini-gráfico SVG dentro do card
function miniChart(prices, color) {
  if (!prices || prices.length<2) return "";
  const w=90, h=36;
  const min=Math.min(...prices), max=Math.max(...prices);
  const range = max-min || 1;
  const pts = prices.map((p,i)=>
    `${(i/(prices.length-1))*w},${h-((p-min)/range)*h}`
  ).join(" ");
  const c = prices[prices.length-1]>=prices[0] ? "#22c55e" : "#ef4444";
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`;
}

// ═══════════════════════════════════════════════════════════════
// API — COINGECKO (dados reais dos últimos 30 dias em BRL)
// ═══════════════════════════════════════════════════════════════
async function fetchCoin(coinId) {
  const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=brl&days=30&interval=daily`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return json.prices.map(([,p]) => p); // retorna apenas os preços
}

          {s:"AGUARDAR",       d:"Sem sinal claro definido",      c:"#f59e0b"},
          {s:"VENDA / REALIZAR",d:"RSI > 72 — realizar lucros",  c:"#ef4444"},
        ].map(g=>`
          <div class="guide-item">
            <div class="guide-dot" style="background:${g.c}"></div>
            <div>
              <div class="guide-signal" style="color:${g.c}">${g.s}</div>
              <div class="guide-desc">${g.d}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
  loadAllCoins();
}

async function loadAllCoins() {
  for (const coin of COINS) {
    loadCoin(coin); // carrega em paralelo, um por vez para não bater no rate limit
    await new Promise(r => setTimeout(r, 400)); // pequeno delay entre chamadas
  }
}

async function loadCoin(coin) {
  try {
    const prices = await fetchCoin(coin.id);
    const rsi    = computeRSI(prices);
    const ema21a = computeEMA(prices, 21);
    const ema55a = computeEMA(prices, Math.min(55, prices.length-1));
    const ema21  = ema21a[ema21a.length-1];
    const ema55  = ema55a[ema55a.length-1];
    const price  = prices[prices.length-1];
    const signal = getSignal(rsi, price, ema21, ema55);
    const change = ((price - prices[0]) / prices[0]) * 100;

    // Atualiza card com dados reais
    document.getElementById(`card-${coin.id}`).style.borderColor = signal.color+"44";
    document.getElementById(`price-${coin.id}`).textContent = fBRL(price);
    const changeEl = document.getElementById(`change-${coin.id}`);
    changeEl.textContent = `${change>=0?"▲":"▼"} ${Math.abs(change).toFixed(2)}% (30d)`;
    changeEl.style.color = change>=0 ? "#22c55e" : "#ef4444";
    document.getElementById(`chart-${coin.id}`).innerHTML = miniChart(prices.slice(-20), coin.color);

    const rsiAlert = rsi<35 || rsi>70;
    document.getElementById(`indicators-${coin.id}`).innerHTML = `
      <div class="indicators">
        <div class="indicator ${rsiAlert?"alert":""}">
          <div class="indicator-label">RSI 14</div>
          <div class="indicator-value">${rsi ? rsi.toFixed(1) : "—"}</div>
        </div>
        <div class="indicator">
          <div class="indicator-label">EMA 21</div>
          <div class="indicator-value">${fBRL(ema21)}</div>
        </div>
        <div class="indicator">
          <div class="indicator-label">EMA 55</div>
          <div class="indicator-value">${fBRL(ema55)}</div>
        </div>
      </div>
      <span class="signal-badge" style="background:${signal.color}22;color:${signal.color};border:1px solid ${signal.color}55">
        ${signal.label}
      </span>
      <div class="signal-bar-wrap">
        <div class="signal-bar-label">FORÇA DO SINAL</div>
        <div class="signal-bar-bg">
          <div class="signal-bar-fill" style="width:${signal.score}%;background:linear-gradient(90deg,${signal.color}66,${signal.color})"></div>
        </div>
      </div>
    `;
  } catch(e) {
    document.getElementById(`indicators-${coin.id}`).innerHTML =
      `<div class="error-msg">⚠ Limite da API atingido — aguarde 1 minuto e clique Atualizar.</div>`;
  }
}

// CALENDAR PANEL
// ═══════════════════════════════════════════════════════════════
let calState = { year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };

function renderCalendar() {
  const panel = document.getElementById("panel-calendar");
  const { year, month, selected } = calState;
  const today = new Date();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  const eventMap = {};
  CALENDAR_EVENTS.forEach(e => { eventMap[e.date] = e; });

  const cells = [];
  for (let i=0; i<firstDay; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);

  const todayStr = today.toISOString().slice(0,10);
  const upcoming = CALENDAR_EVENTS.filter(e => e.date>=todayStr).slice(0,5);

  panel.innerHTML = `
    <div class="cal-nav">
      <button class="cal-btn" onclick="calNav(-1)">‹</button>
      <span class="cal-title">${MONTHS[month]} ${year}</span>
      <button class="cal-btn" onclick="calNav(1)">›</button>
    </div>

    <div class="cal-legend">
      ${[["analysis","Análise Técnica"],["rebalance","Rebalanceamento"],["fed","Evento Macro"],["staking","Staking"]].map(([t,l])=>`
        <div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:${EVENT_COLORS[t].dot}"></div>${l}
        </div>
      `).join("")}
    </div>

    <div class="cal-days-header">
      ${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="cal-day-name">${d}</div>`).join("")}
    </div>

    <div class="cal-grid">
      ${cells.map((d,i) => {
        if (!d) return `<div></div>`;
        const key = `${year}-${pad(month+1)}-${pad(d)}`;
        const ev = eventMap[key];
        const ec = ev ? EVENT_COLORS[ev.type] : null;
        const isToday = d===today.getDate() && month===today.getMonth() && year===today.getFullYear();
        return `
          <div class="cal-cell ${isToday?"today":""} ${ev?"has-event":""}"
            style="${ec ? `background:${ec.bg};border-color:${ec.border}44` : ""}"
            ${ev ? `onclick="calSelect('${key}')"` : ""}>
            <span class="cal-cell-num" style="${ec ? `color:${ec.text}` : ""}">${d}</span>
            ${ev ? `<div class="cal-event-dot" style="background:${ec.dot}"></div>` : ""}
          </div>
        `;
      }).join("")}
    </div>

    ${selected ? `
      <div class="cal-event-detail" style="background:${EVENT_COLORS[selected.type].bg};border:1px solid ${EVENT_COLORS[selected.type].border}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="cal-event-type" style="color:${EVENT_COLORS[selected.type].text}">${selected.date} · ${selected.type.toUpperCase()}</div>
            <div class="cal-event-title">${selected.title}</div>
          </div>
          <button class="cal-close" onclick="calClose()">✕</button>
        </div>
        <div class="cal-event-desc">${selected.desc}</div>
      </div>
    ` : ""}

    <div class="cal-upcoming-label">PRÓXIMOS EVENTOS</div>
    ${upcoming.map(e => {
      const ec = EVENT_COLORS[e.type];
      return `
        <div class="cal-upcoming-item" onclick="calSelectEvent('${e.date}')">
          <div class="cal-upcoming-bar" style="background:${ec.dot}"></div>
          <div>
            <div class="cal-upcoming-date">${e.date}</div>
            <div class="cal-upcoming-title" style="color:${ec.text}">${e.title}</div>
            <div class="cal-upcoming-desc">${e.desc.substring(0,65)}…</div>
          </div>
        </div>
      `;
    }).join("")}
  `;
}

function calNav(dir) {
  let m = calState.month + dir;
  let y = calState.year;
  if (m>11) { m=0; y++; }
  if (m<0)  { m=11; y--; }
  calState = { ...calState, year:y, month:m, selected:null };
  renderCalendar();
}

function calSelect(dateKey) {
  const ev = CALENDAR_EVENTS.find(e => e.date===dateKey);
  calState.selected = ev || null;
  renderCalendar();
}

function calSelectEvent(dateKey) { calSelect(dateKey); }
function calClose() { calState.selected=null; renderCalendar(); }

function switchTab(name, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  ["signals","calendar","rebalance"].forEach(p => {
    document.getElementById(`panel-${p}`).style.display = p===name ? "block" : "none";
  });
}

let cooldown = false;
function refresh() {
  if (cooldown) return;
  renderSignals();
  const meta = document.getElementById("header-meta");
  const btn  = document.getElementById("btn-refresh");
  meta.textContent = `última consulta: ${new Date().toLocaleTimeString("pt-BR")} · CoinGecko API · RSI 14 + EMA 21/55`;
  cooldown = true;
  btn.disabled = true;
  btn.textContent = "⏳ aguardar...";
  setTimeout(() => {
    cooldown = false;
    btn.disabled = false;
    btn.textContent = "↻ Atualizar";
  }, 60000);
}

// ═══════════════════════════════════════════════════════════════
// PWA — SERVICE WORKER + INSTALL PROMPT
// ═══════════════════════════════════════════════════════════════
let deferredPrompt = null;

// Captura o evento de instalação do browser
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install-banner").classList.remove("hidden");
});

function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById("install-banner").classList.add("hidden");
  });
}

// Registra Service Worker para funcionamento offline
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // O service worker é inline via blob para funcionar em arquivo único
    const swCode = `
      const CACHE = "crypto-dash-v1";
      const ASSETS = ["/", "./index.html"];
      self.addEventListener("install", e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
      });
      self.addEventListener("fetch", e => {
        // Para a API do CoinGecko, sempre busca rede (dados frescos)
        if (e.request.url.includes("coingecko")) return;
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], { type: "application/javascript" });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  });
}
